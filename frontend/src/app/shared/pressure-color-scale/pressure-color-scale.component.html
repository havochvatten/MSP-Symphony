<svg viewBox="0 0 200 30">
  @for (color of colors; track $index; let i = $index) {
    <rect
      width="20"
      height="20"
      y="10"
      [attr.x]="i * 20"
      [attr.fill]="color.color"
    ></rect>
  }
  @for (color of colors; track $index; let i = $index) {
    <text [attr.x]="i * 20" y="5" font-size="5">
      {{ color.min }}%
    </text>
  }
</svg>
