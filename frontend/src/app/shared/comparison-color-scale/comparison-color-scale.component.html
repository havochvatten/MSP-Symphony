@for (legendEntry of legends; track legendEntry) {
  @if (legends.length === 1) {
    <h5 class="single-value">{{ 'map.color-scale.comparison' | translate }}</h5>
  }
  @if (legends.length > 1) {
    @for (legendTitle of legendEntry.title; track legendTitle) {
      <h5>{{ legendTitle }}</h5>
    }
  }
  <app-result-color-scale
    [colors]="legendEntry.legend.colorMap"
    [perMille]="true"
    [decimals]="false"
  [unit]="legendEntry.legend.unit"></app-result-color-scale>
}
