# Example Symphony Apache virtual host configuration definition

<VirtualHost *:80>
    ServerName myserver.domain.org
    Redirect permanent / https://myserver.domain.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName  myserver.domain.org
    SSLEngine on
    SSLCertificateFile "/cert/my.cer"
    SSLCertificateKeyFile "/cert/my.key"
    SSLProxyEngine on
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    ProxyRequests Off
    ProxyVia Off
    ProxyPreserveHost On
    ProxyStatus On
	ProxyPass /socket/batch-status  wss://localhost:8443/symphony-ws/batch-status
    ProxyPass   /symphony-ws/service    https://myserver:8443/symphony-ws/service
    ProxyPassReverse    /symphony-ws/service    https://myserver:8443/symphony-ws/service
    # Swagger UI was previously disabled (release 1.3). May be reinstated in a future release.
    ## Swagger should probably be disabled in a production environment
    ## ProxyPass   /swagger    https://myserver:8443/symphony-ws/swagger
    ## ProxyPassReverse    /swagger    https://myserver:8443/symphony-ws/swagger
    DocumentRoot /webapp/dev
    <Directory /webapp/dev>
        RewriteEngine on
        # Don't rewrite files or directories
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        # Rewrite everything else to index.html
        # to allow html5 state links
        RewriteRule ^ index.html [L]

        # Browser caching (needs mod_headers). Files with a fixed name (index.html,
        # the translations in assets/i18n, the branding in assets/config, the logos)
        # are checked with the server on every load, a quick 304 when unchanged.
        # Without this, browsers can keep the previous release's translations for
        # days after an update and show raw keys for new texts. Files with a content
        # hash in the name (main.<hash>.js and so on) get a new name in every build
        # and can be kept for a year.
        # With mod_expires instead of mod_headers: "ExpiresActive On" and
        # ExpiresDefault "access plus 0 seconds" here, and "access plus 1 year" in
        # the FilesMatch block.
        Header set Cache-Control "no-cache"
        <FilesMatch "\.[0-9a-f]{16}\.(js|css|svg|png|woff2?|ttf)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
    </Directory>
</VirtualHost>
